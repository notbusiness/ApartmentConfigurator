[/Script/EngineSettings.GameMapsSettings]
; The project ships without its own level: the engine's basic template level
; (sun, sky atmosphere, sky light, fog, clouds) is used, everything else is spawned from C++.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/ApartmentConfigurator.ConfiguratorGameMode

[/Script/Engine.RendererSettings]
; Fully dynamic lighting: the building is generated at runtime, nothing can be baked.
; Lumen gives bounced light and sky reflections in the glass.
; Virtual shadow maps are deliberately left off (regular cascaded shadow maps are used):
; with them enabled the editor viewport hangs the GPU (DXGI_ERROR_DEVICE_HUNG) on 4 GB cards
; such as the GTX 1650, and the visual difference for this scene is small.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
